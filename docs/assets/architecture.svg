<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#0E1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B6CFF"/>
      <stop offset="100%" stop-color="#6F7CFF"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34D399"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#E6EDF7" font-size="30" font-weight="700" letter-spacing="2">知序 Zhixu · 系统架构</text>
  <text x="600" y="82" text-anchor="middle" fill="#8DA1B9" font-size="14" letter-spacing="1">本地优先 · 单一 Agent 内核 · 可逆写入 · 长期记忆</text>

  <!-- ═══════════ Layer 1: Obsidian Plugin ═══════════ -->
  <rect x="60" y="110" width="1080" height="150" rx="16" fill="rgba(56,189,248,0.05)" stroke="rgba(56,189,248,0.28)" stroke-width="1"/>
  <rect x="60" y="110" width="1080" height="34" rx="16" fill="rgba(56,189,248,0.10)"/>
  <rect x="60" y="128" width="1080" height="16" fill="rgba(56,189,248,0.10)"/>
  <circle cx="90" cy="127" r="6" fill="url(#sky)"/>
  <text x="106" y="132" fill="#7DD3FC" font-size="16" font-weight="600">Obsidian Plugin — TypeScript</text>
  <text x="1060" y="132" text-anchor="end" fill="#64748B" font-size="12">交互与状态归约</text>

  <g filter="url(#cardShadow)">
    <rect x="90" y="158" width="480" height="82" rx="12" fill="#111A2E" stroke="rgba(255,255,255,0.08)"/>
    <text x="330" y="184" text-anchor="middle" fill="#E6EDF7" font-size="15" font-weight="600">四模块 UI</text>
    <text x="330" y="208" text-anchor="middle" fill="#8DA1B9" font-size="12">今日 · 计划 · 看板 · 助手</text>
    <text x="330" y="228" text-anchor="middle" fill="#64748B" font-size="11">渲染 · 权限卡 · 推理折叠 · 复制回答</text>

    <rect x="630" y="158" width="480" height="82" rx="12" fill="#111A2E" stroke="rgba(255,255,255,0.08)"/>
    <text x="870" y="184" text-anchor="middle" fill="#E6EDF7" font-size="15" font-weight="600">会话与运行时</text>
    <text x="870" y="208" text-anchor="middle" fill="#8DA1B9" font-size="12">Session Tree · Fork · Steering · Follow-up</text>
    <text x="870" y="228" text-anchor="middle" fill="#64748B" font-size="11">压缩 · 停滞保护 · 断线重连 · 快照恢复</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="600" y1="262" x2="600" y2="304" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowSky)"/>
  <rect x="440" y="272" width="320" height="24" rx="12" fill="#0EA5E9"/>
  <text x="600" y="288" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">prepareTurn → query → AgentChunk reducer</text>

  <!-- ═══════════ Layer 2: Pi Agent Core ═══════════ -->
  <rect x="60" y="316" width="1080" height="150" rx="16" fill="rgba(139,92,246,0.05)" stroke="rgba(139,92,246,0.28)" stroke-width="1"/>
  <rect x="60" y="316" width="1080" height="34" rx="16" fill="rgba(139,92,246,0.10)"/>
  <rect x="60" y="334" width="1080" height="16" fill="rgba(139,92,246,0.10)"/>
  <circle cx="90" cy="333" r="6" fill="url(#violet)"/>
  <text x="106" y="338" fill="#C4B5FD" font-size="16" font-weight="600">Pi Agent Core + Pi AI — 唯一 Agent 内核</text>
  <text x="1060" y="338" text-anchor="end" fill="#64748B" font-size="12">模型决策 · 工具选择 · 重规划</text>

  <g filter="url(#cardShadow)">
    <rect x="220" y="368" width="760" height="82" rx="12" fill="#171233" stroke="rgba(255,255,255,0.08)"/>
    <text x="600" y="396" text-anchor="middle" fill="#DDD6FE" font-size="16" font-weight="700">Model ↔ Tool ↔ Observation ↔ Replan</text>
    <text x="600" y="420" text-anchor="middle" fill="#8DA1B9" font-size="12">DeepSeek 选择受控工具 → 本地执行 → 观察返回 → 继续规划直至完成</text>
    <text x="600" y="440" text-anchor="middle" fill="#64748B" font-size="11">推理文本独立存储 · 永不进入后续模型上下文</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="600" y1="468" x2="600" y2="510" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <rect x="410" y="478" width="380" height="24" rx="12" fill="#8B5CF6"/>
  <text x="600" y="494" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">typed tool requests · localhost NDJSON</text>

  <!-- ═══════════ Layer 3: Python Secure Runtime ═══════════ -->
  <rect x="60" y="522" width="1080" height="226" rx="16" fill="rgba(16,185,129,0.05)" stroke="rgba(16,185,129,0.28)" stroke-width="1"/>
  <rect x="60" y="522" width="1080" height="34" rx="16" fill="rgba(16,185,129,0.10)"/>
  <rect x="60" y="540" width="1080" height="16" fill="rgba(16,185,129,0.10)"/>
  <circle cx="90" cy="539" r="6" fill="url(#emerald)"/>
  <text x="106" y="544" fill="#6EE7B7" font-size="16" font-weight="600">Python Secure Runtime — 安全边界</text>
  <text x="1060" y="544" text-anchor="end" fill="#64748B" font-size="12">密钥 · 策略 · 事务 · 持久化</text>

  <g filter="url(#cardShadow)">
    <rect x="90" y="572" width="330" height="78" rx="12" fill="#0F1F24" stroke="rgba(255,255,255,0.08)"/>
    <text x="255" y="598" text-anchor="middle" fill="#E6EDF7" font-size="14" font-weight="600">模型代理 · Keychain</text>
    <text x="255" y="620" text-anchor="middle" fill="#8DA1B9" font-size="11">秘密不落盘 · 脱敏 · 能力探测</text>
    <text x="255" y="638" text-anchor="middle" fill="#64748B" font-size="10">NDJSON 协议转换 · 错误分类</text>

    <rect x="435" y="572" width="330" height="78" rx="12" fill="#0F1F24" stroke="rgba(255,255,255,0.08)"/>
    <text x="600" y="598" text-anchor="middle" fill="#E6EDF7" font-size="14" font-weight="600">Workspace Policy</text>
    <text x="600" y="620" text-anchor="middle" fill="#8DA1B9" font-size="11">目录语义 · 8 种笔记类型 · 链接规则</text>
    <text x="600" y="638" text-anchor="middle" fill="#64748B" font-size="10">WriteIntent 校验 · 重复检测 · 受保护目标</text>

    <rect x="780" y="572" width="330" height="78" rx="12" fill="#0F1F24" stroke="rgba(255,255,255,0.08)"/>
    <text x="945" y="598" text-anchor="middle" fill="#E6EDF7" font-size="14" font-weight="600">长期记忆 Memory</text>
    <text x="945" y="620" text-anchor="middle" fill="#8DA1B9" font-size="11">目标 · 偏好 · 知识状态 · 项目决策</text>
    <text x="945" y="638" text-anchor="middle" fill="#64748B" font-size="10">候选晋升 · supersede 链 · 证据只存引用</text>

    <rect x="90" y="664" width="520" height="68" rx="12" fill="#0F1F24" stroke="rgba(255,255,255,0.08)"/>
    <text x="350" y="690" text-anchor="middle" fill="#E6EDF7" font-size="14" font-weight="600">可逆事务 · 检索 · 混合索引</text>
    <text x="350" y="712" text-anchor="middle" fill="#8DA1B9" font-size="11">Snapshot → Apply → Verify → Undo · 冲突安全 · FTS/BM25</text>

    <rect x="630" y="664" width="480" height="68" rx="12" fill="#0F1F24" stroke="rgba(255,255,255,0.08)"/>
    <text x="870" y="690" text-anchor="middle" fill="#E6EDF7" font-size="14" font-weight="600">Task Authorization · 审计</text>
    <text x="870" y="712" text-anchor="middle" fill="#8DA1B9" font-size="11">Turn 范围冻结 · 越权确认 · 权限卡恢复 · audit 日志</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="600" y1="750" x2="600" y2="792" stroke="#34D399" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <rect x="440" y="758" width="320" height="24" rx="12" fill="#10B981"/>
  <text x="600" y="774" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Markdown 唯一真相 · SQLite 运行时状态</text>

  <!-- ═══════════ Layer 4: Storage ═══════════ -->
  <rect x="60" y="806" width="1080" height="80" rx="16" fill="rgba(245,158,11,0.05)" stroke="rgba(245,158,11,0.28)" stroke-width="1"/>
  <circle cx="90" cy="835" r="6" fill="url(#amber)"/>
  <text x="106" y="840" fill="#FCD34D" font-size="16" font-weight="600">本地存储</text>

  <g filter="url(#cardShadow)">
    <rect x="230" y="824" width="440" height="46" rx="10" fill="#241C0F" stroke="rgba(255,255,255,0.08)"/>
    <text x="450" y="852" text-anchor="middle" fill="#E6EDF7" font-size="13" font-weight="600">Markdown — 知识正文真相</text>

    <rect x="700" y="824" width="410" height="46" rx="10" fill="#241C0F" stroke="rgba(255,255,255,0.08)"/>
    <text x="905" y="852" text-anchor="middle" fill="#E6EDF7" font-size="13" font-weight="600">SQLite — 运行时状态（90-Local-Only）</text>
  </g>

  <!-- Legend -->
  <text x="600" y="888" text-anchor="middle" fill="#64748B" font-size="11" letter-spacing="1">决策与交互：TypeScript ｜ 安全与事务：Python ｜ 真相：Markdown</text>
</svg>
